name: keepalive

# Render's FREE web services spin down after 15 minutes without traffic.
# This ping every 10 minutes keeps the WhatsApp socket alive 24/7 for $0.
#
# Setup (one time):
#   Repo -> Settings -> Secrets and variables -> Actions -> Variables
#   New repository variable:  BOT_URL = https://<your-app>.onrender.com

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping bot health endpoint
        env:
          BOT_URL: ${{ vars.BOT_URL }}
        run: |
          if [ -z "$BOT_URL" ]; then
            echo "BOT_URL variable is not set — skipping."
            exit 0
          fi
          for i in 1 2 3 4; do
            code=$(curl -sS -m 60 -o /tmp/health -w "%{http_code}" "$BOT_URL/health" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health
              echo
              exit 0
            fi
            sleep 20
          done
          echo "all attempts failed (bot may be redeploying)"
