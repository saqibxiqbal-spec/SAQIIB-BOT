# SAQIIB BOT — Render Blueprint (100% FREE, no credit card)
# One-click: https://render.com/deploy?repo=https://github.com/saqibxiqbal-spec/SAQIIB-BOT
#
# NOTE: Render's free plan does NOT support persistent disks, so we do not ask
# for one. Instead the session folder is restored from the SESSION_ID env var
# (base64 zip) on every boot — that is what keeps the device linked for free.
# The .github/workflows/keepalive.yml cron pings /health every 10 min so the
# free instance never spins down.
services:
  - type: web
    name: saqiib-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: MODE
        value: public
      - key: MAX_SESSIONS
        value: "5"
      - key: BOT_NAME
        value: SAQIIB BOT
      - key: OWNER_NAME
        value: "I'm Saqiib king 👑"
      - key: OWNER_NUMBER
        value: "923134182952"
      - key: DEFAULT_COUNTRY_CODE
        value: "92"
      - key: PORTAL_PASSWORD
        value: "off"
      - key: CHANNEL_LINK
        value: ""
      - key: GROUP_LINK
        value: ""
      # --- auto/anti features default OFF ---
      - key: AUTO_READ
        value: "false"
      - key: AUTO_TYPING
        value: "false"
      - key: AUTO_REACT
        value: "false"
      - key: ANTIDELETE
        value: "false"
      - key: ANTILINK
        value: "false"
      - key: ANTISPAM
        value: "false"
      - key: ANTICALL
        value: "false"
      - key: CHATBOT
        value: "false"
      - key: ONLINE
        value: "true"
      # Base64 zip of session/ — set this in the Render dashboard after pairing.
      - key: SESSION_ID
        sync: false
      # Optional. Leave blank to rely on SESSION_ID only.
      - key: MONGODB_URI
        sync: false
